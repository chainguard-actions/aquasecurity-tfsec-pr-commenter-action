name: Test soft fail commenter mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create Terraform file with known security issues for tfsec to find
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/terraform-insecure"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/terraform-insecure/main.tf" << 'EOF'
          # Intentionally insecure Terraform for tfsec testing
          resource "aws_s3_bucket" "insecure" {
            bucket = "insecure-bucket"
          }

          resource "aws_security_group" "wide_open" {
            name        = "wide-open"
            description = "Wide open security group"

            ingress {
              from_port   = 0
              to_port     = 65535
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: tests/fixtures/terraform-insecure
          soft_fail_commenter: "true"

      - name: Assert action ran in soft fail mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With soft_fail_commenter=true, the action should not break the build
          # However, the commenter binary will fail because there's no real PR
          # in the sentinel repository environment
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in soft fail mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo - commenter cannot post to non-existent PR)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
