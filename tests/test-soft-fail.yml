name: Test soft fail commenter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Terraform fixture with known security issues
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/terraform-insecure"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/terraform-insecure/main.tf" <<'EOF'
          resource "aws_security_group_rule" "example" {
            type        = "ingress"
            from_port   = 0
            to_port     = 65535
            protocol    = "tcp"
            cidr_blocks = ["0.0.0.0/0"]
            security_group_id = "sg-12345678"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: tests/fixtures/terraform-insecure
          soft_fail_commenter: "true"

      - name: Assert action ran with soft fail enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RETURN_CODE: ${{ steps.action.outputs.tfsec-return-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tfsec-return-code: $RETURN_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with soft_fail_commenter=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - sentinel repo or commenter API failure)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
