name: Test custom working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Terraform fixture in nested directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/terraform-nested/modules/vpc"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/terraform-nested/modules/vpc/main.tf" <<'EOF'
          variable "vpc_cidr" {
            description = "CIDR block for VPC"
            default     = "10.0.0.0/16"
          }

          resource "aws_vpc" "main" {
            cidr_block = var.vpc_cidr
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: tests/fixtures/terraform-nested
          soft_fail_commenter: "true"

      - name: Assert action ran against the specified working directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RETURN_CODE: ${{ steps.action.outputs.tfsec-return-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tfsec-return-code: $RETURN_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded scanning nested working directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected - sentinel repo or commenter API failure)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
