name: Test soft fail commenter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a Terraform file with known security issues for tfsec to detect
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tf-insecure"
          cat > "$GITHUB_WORKSPACE/tf-insecure/main.tf" <<'EOF'
          resource "aws_security_group_rule" "example" {
            type        = "ingress"
            from_port   = 0
            to_port     = 65535
            protocol    = "tcp"
            cidr_blocks = ["0.0.0.0/0"]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          working_directory: tf-insecure
          soft_fail_commenter: "true"
          tfsec_version: latest

      - name: Assert action ran with soft_fail enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RETURN_CODE: ${{ steps.action.outputs.tfsec-return-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tfsec-return-code: $RETURN_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with soft_fail_commenter=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
